        const [noDisposableCutlery, setNoDisposableCutlery] = useState(false);
        const [pickupSlot, setPickupSlot] = useState('12:00 PM – 12:15 PM');

        const [orders, setOrders] = useState(() => {
          try {
            const saved = localStorage.getItem('mealhub_orders_v1');
            return saved ? JSON.parse(saved) : [];
          } catch {
            return [];
          }
        });
        const [trackedOrderId, setTrackedOrderId] = useState(null);
        const [ordersSubTab, setOrdersSubTab] = useState('active');
        const [nowTick, setNowTick] = useState(() => Date.now());
        const [showReceiptDetails, setShowReceiptDetails] = useState(false);

        useEffect(() => {
          try {
            localStorage.setItem('mealhub_orders_v1', JSON.stringify(orders));
          } catch {}
        }, [orders]);

        useEffect(() => {
          const timer = setInterval(() => {
            const current = Date.now();
            setNowTick(current);

            setOrders((prevOrders) => {
              let changed = false;
              const updated = prevOrders.map((ord) => {
                if (ord.status === 'Completed' || ord.status === 'Cancelled' || !ord.createdAtMs) {
                  return ord;
                }
                const totalPrepSec = ord.totalPrepSec || 300;
                const elapsedSec = Math.floor((current - ord.createdAtMs) / 1000);
                let nextStatus = ord.status;

                if (elapsedSec >= totalPrepSec) {
                  nextStatus = 'Ready for Collection';
                } else if (elapsedSec >= Math.min(25, Math.floor(totalPrepSec * 0.25))) {
                  nextStatus = 'Preparing';
                } else if (elapsedSec >= 6) {
                  nextStatus = 'Accepted';
                }

                if (nextStatus !== ord.status) {
                  changed = true;
                  return {
                    ...ord,
                    status: nextStatus,
                    stageTimestamps: {
                      ...(ord.stageTimestamps || {}),
                      [nextStatus]: new Date(current).toLocaleTimeString([], {
                        hour: '2-digit',
                        minute: '2-digit'
                      })
                    }
                  };
                }
                return ord;
              });

              return changed ? updated : prevOrders;
            });
          }, 1000);

          return () => clearInterval(timer);
        }, []);

        const showToast = (text, actionLabel = null, onAction = null) => {
          setToastMessage({ text, actionLabel, onAction });
          setTimeout(() => {
            setToastMessage((prev) => (prev && prev.text === text ? null : prev));
          }, 3800);
        };

        const validateAuthForm = () => {
          const errors = {};
          const emailTrimmed = emailInput.trim();
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

          if (!emailTrimmed) {
            errors.email = 'Please enter your university or personal email address.';
          } else if (!emailRegex.test(emailTrimmed)) {
            errors.email = 'Please enter a valid email address (e.g., student@serimaju.edu.my).';
          }

          if (authMode !== 'forgot') {
            if (!passwordInput) {
              errors.password = 'Please enter your password.';
            } else if (passwordInput.length < 6) {
              errors.password = 'Password must be at least 6 characters long.';
            }
          }

          if (authMode === 'register' && !fullNameInput.trim()) {
            errors.fullName = 'Please enter your full name.';
          }

          setFormErrors(errors);
          return Object.keys(errors).length === 0;
        };

        const handleAuthSubmit = (e) => {
          e.preventDefault();
          setAuthBannerError('');

          if (!validateAuthForm()) return;

          if (authMode === 'forgot') {
            setResetSent(true);
            return;
          }

          setAuthLoading(true);
          setTimeout(() => {
            setAuthLoading(false);
            const emailLower = emailInput.trim().toLowerCase();
            const derivedName =
              authMode === 'register' && fullNameInput.trim()
                ? fullNameInput.trim()
                : emailLower
                    .split('@')[0]
                    .replace(/[._-]/g, ' ')
                    .replace(/\b\w/g, (c) => c.toUpperCase());

            setUserProfile({
              name: derivedName || 'Student',
              studentId:
                authMode === 'register' && studentIdInput.trim()
                  ? studentIdInput.trim().toUpperCase()
                  : 'USM-2026-0842',
              university: 'Universiti Seri Maju',
              email: emailLower,
              isGuest: false
            });
            setIsAuthenticated(true);
            setActiveTab('Home');
          }, 300);
        };

        const handleGoogleSignIn = () => {
          setAuthBannerError('');
          setFormErrors({});
          setAuthLoading(true);
          setTimeout(() => {
            setAuthLoading(false);
            setUserProfile({

          setIsAuthenticated(false);
          setAuthMode('login');
          setPasswordInput('');
          setFormErrors({});
          setAuthBannerError('');
          setResetSent(false);
        };

        const filteredRegularMeals = useMemo(() => {
          return REGULAR_MEALS.filter((meal) => {
            if (selectedCategory !== 'All' && meal.cuisine !== selectedCategory) return false;
            if (selectedVendorFilter !== 'all' && meal.vendorId !== selectedVendorFilter) return false;
            if (onlyUnder5 && meal.price > 5) return false;
            if (searchQuery.trim()) {
              const q = searchQuery.toLowerCase();
              const matchName = meal.name.toLowerCase().includes(q);
              const matchVendor = meal.vendorName.toLowerCase().includes(q);
              const matchCuisine = meal.cuisine.toLowerCase().includes(q);
              const matchDesc = meal.description.toLowerCase().includes(q);
              if (!matchName && !matchVendor && !matchCuisine && !matchDesc) return false;
            }
            return true;
          });
        }, [selectedCategory, selectedVendorFilter, onlyUnder5, searchQuery]);

        const filteredSurplusMeals = useMemo(() => {
          return SURPLUS_MEALS.filter((meal) => {
            if (selectedCategory !== 'All' && meal.cuisine !== selectedCategory) return false;
            if (selectedVendorFilter !== 'all' && meal.vendorId !== selectedVendorFilter) return false;
            if (searchQuery.trim()) {
              const q = searchQuery.toLowerCase();
              const matchName = meal.name.toLowerCase().includes(q);
              const matchVendor = meal.vendorName.toLowerCase().includes(q);
              const matchCuisine = meal.cuisine.toLowerCase().includes(q);
              if (!matchName && !matchVendor && !matchCuisine) return false;
            }
            return true;
          });
        }, [selectedCategory, selectedVendorFilter, searchQuery]);

        const openCustomizeModal = (meal) => {
          setSelectedMealModal(meal);
          setCustomSpiceLevel('Normal');
          setCustomOptions([]);
          setCustomRemark('');
          setCustomQty(1);
        };

        const toggleCustomOption = (opt) => {
          setCustomOptions((prev) =>
            prev.includes(opt) ? prev.filter((item) => item !== opt) : [...prev, opt]
          );
        };

        const totalCartItems = useMemo(
          () => cart.reduce((sum, item) => sum + item.quantity, 0),
          [cart]
        );

        const totalCartAmount = useMemo(
          () => cart.reduce((sum, item) => sum + item.price * item.quantity, 0),
          [cart]
        );

        const handleAddToCart = (meal, customization = null) => {
          const qtyToAdd = customization?.quantity || 1;
          const isDrinkOrSnack = meal.cuisine === 'Drinks' || meal.cuisine === 'Snacks';
          const spice = !isDrinkOrSnack && customization?.spiceLevel ? customization.spiceLevel : null;
          const opts = customization?.options || [];
          const remark = (customization?.remark || '').trim();

          const customSignature = [spice || '', opts.slice().sort().join(','), remark.toLowerCase()].join('|');
          const cartKey = `${meal.id}::${customSignature}`;

          setCart((prev) => {
            const existing = prev.find((item) => item.cartKey === cartKey);
            if (existing) {
              return prev.map((item) =>
                item.cartKey === cartKey ? { ...item, quantity: item.quantity + qtyToAdd } : item
              );
            }
            return [
              ...prev,
              {
                ...meal,
                cartKey,
                quantity: qtyToAdd,
                spiceLevel: spice,
                selectedOptions: opts,
                remark
              }
            ];
          });

          showToast(`${qtyToAdd} × ${meal.name} added to cart.`, 'View cart', () => {
            setActiveTab('Cart');
          });
        };

        const updateCartQuantity = (cartKey, delta) => {
          setCart((prev) =>
            prev
              .map((item) =>
                item.cartKey === cartKey ? { ...item, quantity: item.quantity + delta } : item
              )
              .filter((item) => item.quantity > 0)
          );
        };

        const removeCartItem = (cartKey) => {
          setCart((prev) => prev.filter((item) => item.cartKey !== cartKey));
        };

        const handlePlaceOrder = () => {
          if (cart.length === 0) return;

          const firstVendor = CAMPUS_VENDORS.find((v) => v.id === cart[0].vendorId);
          const randomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
          const orderId = `MH17${randomCode}`;
          const collectionPin = String(Math.floor(1000 + Math.random() * 9000));
          const placedTimeStr = new Date().toLocaleTimeString([], {
            hour: '2-digit',
            minute: '2-digit'
          });
          const hasOnlyDrinksOrSurplus = cart.every(
            (item) => item.cuisine === 'Drinks' || item.isSurplus
          );
          const totalPrepSec = hasOnlyDrinksOrSurplus ? 180 : 420;

          const newOrder = {
            id: orderId,
            collectionPin,
            createdAtMs: Date.now(),
            totalPrepSec,
            stageTimestamps: {
              Pending: placedTimeStr
            },
            vendorName: cart[0].vendorName,
            stall: cart[0].stall,
            vendorPhone: firstVendor?.phone || '+60 11-2345 6700',
            dateLabel: 'Mon, 23 Nov',
            pickupSlot,
            packaging: packagingType,
            noDisposableCutlery,
            items: [...cart],
            total: totalCartAmount,
            status: 'Pending'
          };

          setOrders((prev) => [newOrder, ...prev]);
          setTrackedOrderId(orderId);
          setOrdersSubTab('active');
          setShowReceiptDetails(false);
          setCart([]);
          setActiveTab('Orders');
          showToast(`Order ${orderId} sent to ${newOrder.vendorName}!`);
        };

        const handleCopyPin = (pin) => {
          try {
            const tempInput = document.createElement('input');
            tempInput.value = pin;
            document.body.appendChild(tempInput);

                    {selectedMealModal.cuisine !== 'Drinks' &&
                      selectedMealModal.cuisine !== 'Snacks' && (
                        <div className="pt-3 border-t border-[#DCE2D7]">
                          <div className="flex items-center justify-between mb-2">
                            <label className="text-xs font-extrabold uppercase tracking-wider text-[#14231B]">
                              Spice Level
                            </label>
                            <span className="text-[11px] font-semibold text-[#1A4D2E]">
                              Selected: {customSpiceLevel}
                            </span>
                          </div>
                          <div className="grid grid-cols-2 gap-2">
                            {SPICE_LEVELS.map((lvl) => {
                              const active = customSpiceLevel === lvl.id;
                              return (
                                <button
                                  key={lvl.id}
                                  type="button"
                                  onClick={() => setCustomSpiceLevel(lvl.id)}
                                  className={`flex items-center justify-between px-3 py-2.5 rounded-xl border text-xs font-semibold transition-all cursor-pointer ${
                                    active
                                      ? 'bg-[#1A4D2E] text-white border-[#1A4D2E] shadow-2xs'
                                      : 'bg-white hover:bg-[#ECEEE9] text-[#14231B] border-[#CBD3C6]'
                                  }`}
                                >
                                  <span>{lvl.label}</span>
                                  <span>{lvl.emoji}</span>
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      )}

                    <div className="pt-3 border-t border-[#DCE2D7]">
                      <label className="block text-xs font-extrabold uppercase tracking-wider text-[#14231B] mb-2">
                        {selectedMealModal.cuisine === 'Drinks'
                          ? 'Drink Preferences'
                          : 'Preparation Preferences'}
                      </label>
                      <div className="flex flex-wrap gap-2">
                        {(selectedMealModal.cuisine === 'Drinks'
                          ? DRINK_PREF_OPTIONS
                          : FOOD_ADDON_OPTIONS
                        ).map((opt) => {
                          const checked = customOptions.includes(opt);
                          return (
                            <button
                              key={opt}
                              type="button"
                              onClick={() => toggleCustomOption(opt)}
                              className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border text-xs font-medium transition-all cursor-pointer ${
                                checked
                                  ? 'bg-[#DCE8D8] border-[#1A4D2E] text-[#14231B] font-semibold'
                                  : 'bg-white hover:bg-[#ECEEE9] border-[#CBD3C6] text-[#394A40]'
                              }`}
                            >
                              {checked && (
                                <Check className="w-3.5 h-3.5 text-[#1A4D2E]" strokeWidth={2.8} />
                              )}
                              <span>{opt}</span>
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    <div className="pt-3 border-t border-[#DCE2D7]">
                      <label
                        htmlFor="dish-remark"
                        className="flex items-center gap-1.5 text-xs font-extrabold uppercase tracking-wider text-[#14231B] mb-2"
                      >
                        <FileEdit className="w-3.5 h-3.5 text-[#1A4D2E]" />
                        <span>Remark to Stall (Optional)</span>
                      </label>
                      <textarea
                        id="dish-remark"
                        rows={2}
                        value={customRemark}
                        onChange={(e) => setCustomRemark(e.target.value)}
                        placeholder={
                          selectedMealModal.cuisine === 'Drinks'
                            ? 'e.g., Less ice, bungkus ikat tepi...'
                            : 'e.g., Less spicy sambal on the side, no cucumber, well-done egg...'
                        }
                        className="w-full rounded-xl bg-white border border-[#CBD3C6] focus:border-[#1A4D2E] p-3 text-xs sm:text-sm text-[#14231B] placeholder:text-[#6B7B72] outline-none resize-none"
                      />
                    </div>
                  </div>

                  <div className="p-4 bg-white border-t border-[#DCE2D7] flex items-center gap-3 shrink-0">
                    <div className="inline-flex items-center gap-2 bg-[#ECEEE9] border border-[#CBD3C6] rounded-xl px-2.5 py-2">
                      <button
                        type="button"
                        onClick={() => setCustomQty((q) => Math.max(1, q - 1))}
                        className="p-1 text-[#14231B] cursor-pointer"
                      >
                        <Minus className="w-4 h-4" />
                      </button>
                      <span className="text-sm font-bold w-5 text-center">{customQty}</span>
                      <button
                        type="button"
                        onClick={() => setCustomQty((q) => q + 1)}
                        className="p-1 text-[#14231B] cursor-pointer"
                      >
                        <Plus className="w-4 h-4" />
                      </button>
                    </div>

                    <button
                      type="button"
                      onClick={() => {
                        handleAddToCart(selectedMealModal, {
                          quantity: customQty,
                          spiceLevel: customSpiceLevel,
                          options: customOptions,
                          remark: customRemark
                        });
                        setSelectedMealModal(null);
                      }}
                      className="flex-1 inline-flex items-center justify-center gap-2 rounded-xl bg-[#1A4D2E] hover:bg-[#143D24] text-white font-semibold text-sm py-3 px-4 transition-colors cursor-pointer"
                    >
                      <ShoppingBag className="w-4 h-4" />
                      <span>Add · {formatRM(selectedMealModal.price * customQty)}</span>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* TOAST */}
            {toastMessage && (
              <div className="fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-md rounded-2xl bg-[#14231B] text-white px-4 py-3 shadow-xl flex items-center justify-between gap-3 border border-white/10">
                <span className="text-xs sm:text-sm font-medium">{toastMessage.text}</span>
                {toastMessage.actionLabel && toastMessage.onAction && (
                  <button
                    type="button"
                    onClick={() => {
                      toastMessage.onAction();
                      setToastMessage(null);
                    }}
                    className="text-xs font-extrabold text-emerald-300 underline shrink-0 cursor-pointer"
                  >
                    {toastMessage.actionLabel}
                  </button>
                )}
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
